<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vendor Login</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(
          to bottom right,
          #3e362e,
          #865d26,
          #93785b,
          #ac8968
        );
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        color: #fff;
      }
      .signup-redirect {
        margin-top: 15px;
        font-size: 14px;
      }

      .signup-redirect a {
        color: #e7717d;
        text-decoration: none;
        font-weight: bold;
      }

      .signup-redirect a:hover {
        text-decoration: underline;
      }
      .login-container {
        background: rgba(0, 0, 0, 0.7);
        padding: 2rem;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        width: 300px;
        text-align: center;
      }
      .login-container h2 {
        margin-bottom: 1.5rem;
      }
      .login-container input {
        width: 100%;
        padding: 0.5rem;
        margin: 0.5rem 0;
        border: none;
        border-radius: 5px;
        background: #fff;
        color: #333;
      }
      .login-container button {
        width: 100%;
        padding: 0.75rem;
        border: none;
        border-radius: 5px;
        background: #865d26;
        color: #fff;
        cursor: pointer;
        font-size: 1rem;
      }
      .login-container button:hover {
        background: #93785b;
      }
      #error-message {
        color: #ff4d4d;
        margin-top: 1rem;
        display: none;
      }
      .vendor-page {
        display: none;
        background: linear-gradient(
          to bottom right,
          #003135,
          #024950,
          #0fa4af,
          #afdde5
        );
        min-height: 100vh;
        padding: 2rem;
      }
      .vendor-page .vendor-info {
        background: rgba(255, 255, 255, 0.9);
        padding: 1.5rem;
        border-radius: 10px;
        max-width: 600px;
        margin: 0 auto;
        color: #003135;
      }
      .vendor-page .vendor-info h2 {
        margin-bottom: 1rem;
      }
      .vendor-page .vendor-info p {
        margin: 0.5rem 0;
      }
      .vendor-page .file-upload {
        margin: 1rem 0;
      }
      .vendor-page .file-upload input {
        margin-top: 0.5rem;
      }
      .vendor-page .book-now {
        background: #0fa4af;
        color: #fff;
        padding: 0.75rem;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        margin-top: 1rem;
        width: 100%;
      }
      .vendor-page .book-now:hover {
        background: #024950;
      }
      .vendor-page .logout {
        position: fixed;
        bottom: 1rem;
        right: 1rem;
        background: #003135;
        color: #fff;
        padding: 0.5rem 1rem;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }
      .vendor-page .logout:hover {
        background: #024950;
      }
    </style>
  </head>
  <body>
    <div class="login-container" id="login-container">
      <h2>Vendor Login</h2>
      <form action="/login" method="post">
        <input type="email" id="email" name="email" placeholder="Email" required />
        <input type="password" id="password" name="password" placeholder="Password" required />
        <button type="submit">Login</button>
        <div class="signup-redirect">
          <p>Don't have an account? <a href="/regist">Sign up</a></p>
        </div>
      </form>
    </div>
    
  </body>
</html>
